#DESC configures the module with eight instead of nine GGD parameters. The monitored output comprises the error message on the invalid parameter count.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "point"
position = 445um 220um 0um
number_of_charges = 20

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[CoulombProjectionPropagation]
temperature = 293K
parameters = 0.411, 2.979, -0.232, 0.004, 1.348, -0.535, -1.091, -19.818

#PASS (FATAL) [C:CoulombProjectionPropagation:mydetector] Error in the configuration:\nValue 0.411, 2.979, -0.232, 0.004, 1.348, -0.535, -1.091, -19.818 of key 'parameters' in section 'CoulombProjectionPropagation' is not valid: expected nine parameters a0, a1, a2, a3, b0, b1, b2, b3, b4 of alpha(t) and beta(t), got 8
