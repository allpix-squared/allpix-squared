#DESC projects deposited charges to the implant side of the sensor with an integration time shorter than the drift time. The monitored output comprises the message that the charge carriers are ignored.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "point"
position = 445um 220um 0um
number_of_charges = 20

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[CoulombProjectionPropagation]
log_level = DEBUG
temperature = 293K
integration_time = 1ns
# GGD parameters a0-a3 and b0-b4
parameters = 0.4112, 2.979, -0.232, 0.003955, 1.348, -3.399, -0.5348, -1.091, -19.82

#PASS Charge carriers propagation time not within integration time
