#DESC propagates a charge cloud with an integration time shorter than the drift time. The monitored output comprises the message that the cloud is stopped at the end of the integration time.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "point"
position = 445um 220um 0um
number_of_charges = 6868

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[SphericalRepulsionPropagation]
log_level = DEBUG
temperature = 293K
integration_time = 1ns

#PASS Cloud stopped at integration time
