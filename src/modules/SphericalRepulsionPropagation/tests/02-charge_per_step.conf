#DESC propagates a charge cloud in groups of ten charge carriers. The monitored output comprises the number of charge carrier groups dispatched.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "point"
position = 445um 220um 0um
number_of_charges = 6868

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[SphericalRepulsionPropagation]
log_level = DEBUG
temperature = 293K
charge_per_step = 10

#PASS Total count of propagated charge carriers: 687
