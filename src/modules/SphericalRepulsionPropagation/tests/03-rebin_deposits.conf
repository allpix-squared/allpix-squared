#DESC propagates holes from 40 deposits along a MIP track, which form a single cloud rebinned into groups of seven charge carriers. The monitored output comprises the number of charge carrier groups dispatched.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "mip"
position = 445um 220um
number_of_charges = 15/um
number_of_steps = 40

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[SphericalRepulsionPropagation]
log_level = DEBUG
temperature = 293K
propagate_electrons = false
propagate_holes = true
charge_per_step = 7

#PASS Total count of propagated charge carriers: 858
