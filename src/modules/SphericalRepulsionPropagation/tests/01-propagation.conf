#DESC propagates a 25 keV point-like charge cloud including repulsion to the implant side of the sensor. The monitored output comprises the total number of charge carriers propagated and the number of clouds.
[Allpix]
detectors_file = "detector.conf"
number_of_events = 1
random_seed = 0

[DepositionPointCharge]
model = "fixed"
source_type = "point"
position = 445um 220um 0um
number_of_charges = 6868

[ElectricFieldReader]
model = "linear"
bias_voltage = -150V
depletion_voltage = -100V

[SphericalRepulsionPropagation]
log_level = INFO
temperature = 293K

#PASS Propagated 6868 charges in 1 clouds (lost: 0)
